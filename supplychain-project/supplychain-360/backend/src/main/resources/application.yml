server:
  port: 8080
spring:
  application:
    name: supplychain360-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=supplychain360;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourStrong!Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: supplychain-shipment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.uma.supplychain.events"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-this-please-123456789}
    expiration-ms: 3600000
  kafka:
    order-created-topic: supplychain.order-created
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
