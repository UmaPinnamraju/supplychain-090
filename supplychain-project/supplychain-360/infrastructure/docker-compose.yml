services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes: ["sql_data:/var/opt/mssql"]
  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command: >
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong!Passw0rd'
      -Q "IF DB_ID('supplychain360') IS NULL CREATE DATABASE supplychain360"
    restart: "no"
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  backend:
    build: ../backend
    depends_on:
      sqlserver: {condition: service_healthy}
      kafka: {condition: service_started}
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=supplychain360;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: "YourStrong!Passw0rd"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: "local-development-secret-key-change-this-please-123456789"
    ports: ["8080:8080"]
  frontend:
    build: ../frontend
    depends_on: [backend]
    ports: ["4200:80"]
volumes:
  sql_data:
